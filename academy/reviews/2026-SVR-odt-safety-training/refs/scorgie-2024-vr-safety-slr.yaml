# Review of Scorgie et al. 2024 — VR safety training SLR + meta-analysis (Safety Science)
key: scorgie-2024-vr-safety-slr
type: journal-article
year: 2024
venue: Safety Science 171:106372
url: https://www.sciencedirect.com/science/article/pii/S0925753523003144
citations: 55+
contributions:
  - Systematic literature review + meta-analysis of VR safety training across all domains
  - Quantitative aggregation of knowledge retention/acquisition effect sizes
  - 55 citing
gaps:
  - Not ODT-specific; covers all VR safety training modalities (HMD vs desktop vs CAVE)
tags:
  - foundational
