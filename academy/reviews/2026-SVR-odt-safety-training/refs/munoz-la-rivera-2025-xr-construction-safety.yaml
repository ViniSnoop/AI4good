relevance: critical-anomaly — Included as one of the 7 studies in the paper's scoping review (paper ref [32]) despite NO ODT involvement. This inclusion dilutes the paper's stated scope ("studies investigating omnidirectional treadmills or related locomotion interfaces"). Reviewer can flag this as inclusion-criteria drift.
notes: |
  The paper's own inclusion criteria text (Section II): "...Research investigating omnidirectional
  treadmills or related locomotion interfaces in immersive virtual environments". Muñoz La Rivera
  uses HTC Vive + Android smartphone AR viewer for safety inspection, which is neither ODT nor
  locomotion-interface-focused. The extracted supplementary-material row also says
  "Not in source" for the ODT column, confirming the anomaly at the extraction-data level.
